<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago - Vertex Mobile</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; display: flex; min-height: 100vh; background: #fff; color: #333; }
        .col-izq { flex: 1.2; padding: 60px 5% 60px 10%; box-sizing: border-box; }
        .col-der { flex: 0.8; background: #f5f5f5; padding: 60px 10% 60px 5%; border-left: 1px solid #e1e1e1; box-sizing: border-box; }
        h2 { font-size: 1.3em; font-weight: normal; margin-bottom: 20px; color: #111; }
        .logo { max-height: 40px; margin-bottom: 40px; display: block; filter: brightness(0); }
        .seccion-form { margin-bottom: 40px; }
        .fila-inputs { display: flex; gap: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; border: 1px solid #d9d9d9; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 1px #0071e3; }
        .caja-pago { border: 1px solid #d9d9d9; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
        .opcion-pago { padding: 16px; display: flex; align-items: center; gap: 10px; background: #f0f7ff; border: 1px solid #0071e3; margin: -1px; }
        .btn-pagar { background: #0071e3; color: white; border: none; padding: 20px; border-radius: 5px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        
        .producto-resumen { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .producto-img-box { width: 65px; height: 65px; background: white; border: 1px solid #e1e1e1; border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; }
        .producto-img-box img { max-width: 50px; max-height: 50px; }
        .badge-cantidad { position: absolute; top: -8px; right: -8px; background: rgba(114,114,114,0.9); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; justify-content: center; align-items: center; }
        .producto-info { flex: 1; font-size: 14px; font-weight: 500; }
        .producto-precio { font-size: 14px; font-weight: 500; }
        .total-final { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e1e1e1; font-size: 18px; font-weight: bold; }
        
        @media (max-width: 800px) {
            body { flex-direction: column-reverse; }
            .col-izq, .col-der { padding: 30px 5%; border-left: none; }
            .col-der { border-bottom: 1px solid #e1e1e1; }
        }
    </style>
</head>
<body>

    <div class="col-izq">
        <a href="index.html"><img src="logoApple.png" alt="Vertex Mobile" class="logo"></a>

        <div class="seccion-form">
            <h2>Entrega</h2>
            <div class="fila-inputs">
                <input type="text" id="formNombre" placeholder="Nombre" required>
                <input type="text" id="formApellido" placeholder="Apellidos" required>
            </div>
            <input type="text" placeholder="Dirección" style="margin-bottom: 15px;" required>
            <input type="tel" placeholder="Teléfono" required>
        </div>

        <div class="seccion-form">
            <h2>Pago</h2>
            <div class="caja-pago">
                <div class="opcion-pago">
                    <input type="radio" checked> Pago Contado / Transferencia
                </div>
            </div>
            <button class="btn-pagar" onclick="procesarPago()">Pagar pedido</button>
        </div>
    </div>

    <div class="col-der">
        <div id="lista-resumen"></div>

        <hr style="border: 0; border-top: 1px solid #e1e1e1; margin-bottom: 20px; margin-top: 20px;">
        <div class="total-final">
            <span>Total</span>
            <div><span style="font-size:12px; color:#777;">GTQ</span> <span id="resumenTotal">Q 0.00</span></div>
        </div>
    </div>

    <script>
        // 1. LEER EL CARRITO
        const carrito = JSON.parse(localStorage.getItem('carritoVertex')) || [];

        if (carrito.length === 0) {
            window.location.href = 'index.html'; // Si no hay nada, regresa a la tienda
        } else {
            const contenedorResumen = document.getElementById('lista-resumen');
            let total = 0;

            // Recorremos el carrito para dibujarlo en la pantalla
            carrito.forEach(item => {
                total += parseFloat(item.precio || 0);
                const tituloFinal = item.modelo.toLowerCase().includes('iphone') ? item.modelo : 'iPhone ' + item.modelo;
                
                contenedorResumen.innerHTML += `
                    <div class="producto-resumen">
                        <div class="producto-img-box">
                            <span class="badge-cantidad">1</span>
                            <img src="${item.imagen}" onerror="this.src='logoApple.png'">
                        </div>
                        <div class="producto-info">${tituloFinal} <br> <span style="font-size: 12px; color: #777;">${item.capacidad} GB</span></div>
                        <div class="producto-precio">Q ${parseFloat(item.precio || 0).toLocaleString('es-GT', {minimumFractionDigits: 2})}</div>
                    </div>
                `;
            });

            // Ponemos el total general
            document.getElementById('resumenTotal').innerText = `Q ${total.toLocaleString('es-GT', {minimumFractionDigits: 2})}`;
        }

        // 2. PROCESAR EL PAGO (MANDAR AL PHP)
        function procesarPago() {
            const nombre = document.getElementById('formNombre').value;
            const apellido = document.getElementById('formApellido').value;

            if(nombre.trim() === '' || apellido.trim() === '') {
                alert("Por favor, ingresa tu Nombre y Apellidos."); return;
            }

            const nombreCompleto = nombre + " " + apellido;

            // Como puede haber varios teléfonos, creamos una "misión" (Promise) por cada uno
            const ventasPromises = carrito.map(item => {
                const datosVenta = {
                    id_iphone: item.id,
                    cliente: nombreCompleto,
                    precio: item.precio
                };

                return fetch('https://api-vertex-sdua.onrender.com/registrar_venta.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosVenta)
                }).then(r => r.json());
            });

            // Esperamos a que todas las ventas se registren en PostgreSQL
            Promise.all(ventasPromises)
            .then(resultados => {
                alert("¡Pedido confirmado con éxito! Gracias por tu compra.");
                localStorage.removeItem('carritoVertex'); // Vaciamos el carrito
                window.location.href = 'index.html'; // Regresamos al inicio
            })
            .catch(error => {
                alert("Error de conexión al procesar el pago.");
            });
        }
    </script>
</body>
</html>
